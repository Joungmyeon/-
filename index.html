<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지브리 숲 전자결재 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f4f1;
        }
        /* 토토로 배경 이미지 적용 */
        .totoro-bg {
            position: relative;
        }
        .totoro-bg::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col items-center justify-start py-6 px-4">

    <!-- 모바일 카드 프레임 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[880px] totoro-bg relative border-4 border-emerald-800">
        
        <!-- 상단 헤더 -->
        <header class="bg-emerald-800 text-white p-4 flex items-center justify-between z-10 shadow-md">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌱</span>
                <h1 class="font-bold text-lg">지브리 숲 전자결재</h1>
            </div>
            <div class="text-[11px] bg-emerald-700 px-2 py-1 rounded-full border border-emerald-600 font-medium">
                정면 ➔ 가오나시 ➔ 토토로
            </div>
        </header>

        <!-- 탭 네비게이션 바 -->
        <nav class="bg-emerald-100 flex overflow-x-auto space-x-1 p-2 border-b border-emerald-200 z-10 shrink-0 text-xs">
            <button onclick="switchTab('draft')" id="tab-draft" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-emerald-700 text-white shadow-sm transition-all">기안하기</button>
            <button onclick="switchTab('waiting')" id="tab-waiting" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-white text-emerald-800 hover:bg-emerald-200 transition-all">결재대기</button>
            <button onclick="switchTab('progress')" id="tab-progress" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-white text-emerald-800 hover:bg-emerald-200 transition-all">진행 중 기안</button>
            <button onclick="switchTab('approved')" id="tab-approved" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-white text-emerald-800 hover:bg-emerald-200 transition-all">최종승인</button>
            <button onclick="switchTab('storage')" id="tab-storage" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-white text-emerald-800 hover:bg-emerald-200 transition-all">결재 보관함</button>
            <button onclick="switchTab('rejected')" id="tab-rejected" class="tab-btn px-2.5 py-1.5 rounded-xl font-medium whitespace-nowrap bg-white text-emerald-800 hover:bg-emerald-200 transition-all">반려함</button>
        </nav>

        <!-- 메인 컨텐츠 영역 -->
        <main class="flex-1 overflow-y-auto p-4 z-10 relative">
            
            <!-- 1. 기안하기 -->
            <section id="view-draft" class="view-section space-y-3">
                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl">
                    <h2 class="font-bold text-emerald-900 text-sm mb-1">🌿 새 전자결재 작성</h2>
                    <p class="text-xs text-emerald-700">기안 날짜가 자동으로 기록되며 순차 결재가 진행됩니다.</p>
                </div>
                
                <form id="draft-form" onsubmit="submitDraft(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">문서 제목</label>
                        <input type="text" id="doc-title" required class="w-full px-3 py-2 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="제목을 입력하세요">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">상세 내용 (본문)</label>
                        <textarea id="doc-content" rows="4" required class="w-full px-3 py-2 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="상세 내용을 입력하세요"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">기안자 의견</label>
                        <input type="text" id="doc-opinion" class="w-full px-3 py-2 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="의견을 적어주세요">
                    </div>
                    <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition-all">
                        결재 상신하기 🚀
                    </button>
                </form>
            </section>

            <!-- 2. 결재대기 -->
            <section id="view-waiting" class="view-section hidden space-y-3">
                <h2 class="font-bold text-gray-800 text-sm">⏳ 결재 대기 문서 목록</h2>
                <div id="list-waiting" class="space-y-2"></div>
            </section>

            <!-- 3. 진행 중 기안 -->
            <section id="view-progress" class="view-section hidden space-y-3">
                <h2 class="font-bold text-gray-800 text-sm">🔄 진행 중 기안 목록</h2>
                <div id="list-progress" class="space-y-2"></div>
            </section>

            <!-- 4. 최종승인 -->
            <section id="view-approved" class="view-section hidden space-y-3">
                <h2 class="font-bold text-gray-800 text-sm">✅ 최종 승인 완료 문서</h2>
                <div id="list-approved" class="space-y-2"></div>
            </section>

            <!-- 5. 결재 보관함 -->
            <section id="view-storage" class="view-section hidden space-y-3">
                <h2 class="font-bold text-gray-800 text-sm">📁 결재 보관함 (완료 문서 아카이브)</h2>
                <div id="list-storage" class="space-y-2"></div>
            </section>

            <!-- 6. 반려함 -->
            <section id="view-rejected" class="view-section hidden space-y-3">
                <h2 class="font-bold text-gray-800 text-sm">❌ 반려된 문서 목록</h2>
                <div id="list-rejected" class="space-y-2"></div>
            </section>

        </main>

        <footer class="bg-gray-50 border-t py-2 px-4 text-center text-xs text-gray-500 z-10">
            Ghibli Forest Workflow System v5.0
        </footer>
    </div>

    <!-- 상세 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="font-bold text-base text-emerald-900">문서 상세 내역</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>
            
            <div class="space-y-2.5 text-xs">
                <div class="bg-emerald-50 p-3 rounded-xl space-y-1">
                    <p><strong class="text-emerald-800">기안자:</strong> <span id="modal-author">정면</span></p>
                    <p><strong class="text-emerald-800">기안 일시:</strong> <span id="modal-draft-date" class="font-medium text-gray-700"></span></p>
                    <p><strong class="text-emerald-800">현재 단계:</strong> <span id="modal-step" class="font-bold text-emerald-700"></span></p>
                </div>

                <div>
                    <span class="font-bold text-gray-700 block mb-1">상세 내용 (본문):</span>
                    <div id="modal-content-box" class="p-3 bg-gray-50 border rounded-xl text-gray-800 whitespace-pre-wrap leading-relaxed min-h-[50px]"></div>
                </div>

                <div>
                    <span class="font-bold text-gray-700 block mb-1">기안자 의견:</span>
                    <div id="modal-author-opinion" class="p-2.5 bg-yellow-50 border border-yellow-200 rounded-xl text-gray-800"></div>
                </div>

                <div>
                    <span class="font-bold text-gray-700 block mb-1">결재 처리 타임스탬프 이력:</span>
                    <div id="modal-comment-history" class="space-y-1.5 max-h-32 overflow-y-auto mb-2"></div>
                    <textarea id="modal-new-reply" rows="2" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="검토 의견 또는 답글을 입력하세요"></textarea>
                </div>
            </div>

            <div id="modal-action-buttons" class="flex space-x-2 pt-2 border-t"></div>
        </div>
    </div>

    <script>
        // 로컬 스토리지 초기화 및 기본 데이터
        let documents = JSON.parse(localStorage.getItem('ghibli_docs_v5')) || [
            {
                id: 1,
                title: '토토로 숲 쉼터 정비 건',
                content: '쉼터 벤치 파손으로 인해 보수를 요청합니다.',
                author: '정면',
                opinion: '빠른 조치 부탁드립니다.',
                draftDate: '2026-03-30 09:30',
                step: 'waiting', 
                currentApproverIndex: 0, 
                history: [
                    { approver: '정면', action: '기안 상신', opinion: '빠른 조치 부탁드립니다.', time: '2026-03-30 09:30' }
                ]
            }
        ];

        const approvers = ['가오나시 본부장', '토토로 유경'];

        function saveDocs() {
            localStorage.setItem('ghibli_docs_v5', JSON.stringify(documents));
        }

        function switchTab(tabName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-emerald-700', 'text-white', 'shadow-sm');
                el.classList.add('bg-white', 'text-emerald-800');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-white', 'text-emerald-800');
            activeBtn.classList.add('bg-emerald-700', 'text-white', 'shadow-sm');

            renderLists();
        }

        function submitDraft(e) {
            e.preventDefault();
            const title = document.getElementById('doc-title').value;
            const content = document.getElementById('doc-content').value;
            const opinion = document.getElementById('doc-opinion').value;
            const nowStr = new Date().toLocaleString();

            const newDoc = {
                id: Date.now(),
                title,
                content,
                author: '정면',
                opinion,
                draftDate: nowStr,
                step: 'waiting',
                currentApproverIndex: 0,
                history: [
                    { approver: '정면', action: '기안 상신', opinion: opinion || '없음', time: nowStr }
                ]
            };

            documents.unshift(newDoc);
            saveDocs();
            document.getElementById('draft-form').reset();
            switchTab('waiting');
        }

        function renderLists() {
            const listIds = ['waiting', 'progress', 'approved', 'storage', 'rejected'];
            listIds.forEach(id => {
                document.getElementById(`list-${id}`).innerHTML = '';
            });

            if (documents.length === 0) {
                listIds.forEach(id => {
                    document.getElementById(`list-${id}`).innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">문서가 없습니다.</div>`;
                });
                return;
            }

            documents.forEach(doc => {
                // 최종승인 및 보관함에서는 삭제 버튼 포함 카드 생성
                const isApprovedOrStorage = (doc.step === 'approved');
                const deleteBtnHtml = isApprovedOrStorage ? 
                    `<button onclick="event.stopPropagation(); deleteDoc(${doc.id})" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold shadow">삭제</button>` : '';

                const cardHtml = `
                    <div onclick="openModal(${doc.id})" class="bg-white border border-emerald-100 p-3 rounded-2xl shadow-sm hover:shadow-md transition-all cursor-pointer space-y-1 relative">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm text-gray-800">${doc.title}</span>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] px-2 py-0.5 rounded-full ${getStatusBadgeClass(doc.step)}">${getStatusText(doc)}</span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 truncate">${doc.content}</p>
                        <div class="flex justify-between items-center pt-1 text-[11px] text-gray-400">
                            <span>기안일: ${doc.draftDate}</span>
                            <span>단계: <strong class="text-emerald-700">${getCurrentApproverName(doc)}</strong></span>
                        </div>
                    </div>
                `;

                if (doc.step === 'waiting') document.getElementById('list-waiting').innerHTML += cardHtml;
                else if (doc.step === 'progress') document.getElementById('list-progress').innerHTML += cardHtml;
                else if (doc.step === 'approved') {
                    document.getElementById('list-approved').innerHTML += cardHtml;
                    document.getElementById('list-storage').innerHTML += cardHtml;
                }
                else if (doc.step === 'rejected') document.getElementById('list-rejected').innerHTML += cardHtml;
            });
        }

        function getStatusText(doc) {
            if (doc.step === 'waiting') return '결재대기';
            if (doc.step === 'progress') return `진행중 (${approvers[doc.currentApproverIndex]})`;
            if (doc.step === 'approved') return '최종승인';
            if (doc.step === 'rejected') return '반려됨';
        }

        function getStatusBadgeClass(step) {
            if (step === 'waiting') return 'bg-yellow-100 text-yellow-800';
            if (step === 'progress') return 'bg-blue-100 text-blue-800';
            if (step === 'approved') return 'bg-emerald-100 text-emerald-800';
            if (step === 'rejected') return 'bg-red-100 text-red-800';
        }

        function getCurrentApproverName(doc) {
            if (doc.step === 'waiting') return '가오나시 본부장 (대기)';
            if (doc.step === 'progress') return approvers[doc.currentApproverIndex];
            if (doc.step === 'approved') return '승인완료';
            if (doc.step === 'rejected') return '반려종료';
        }

        let currentOpenDocId = null;

        function openModal(id) {
            currentOpenDocId = id;
            const doc = documents.find(d => d.id === id);
            if (!doc) return;

            document.getElementById('modal-title').innerText = doc.title;
            document.getElementById('modal-author').innerText = doc.author;
            document.getElementById('modal-draft-date').innerText = doc.draftDate;
            document.getElementById('modal-step').innerText = getCurrentApproverName(doc);
            document.getElementById('modal-content-box').innerText = doc.content;
            document.getElementById('modal-author-opinion').innerText = doc.opinion || '의견 없음';

            const historyEl = document.getElementById('modal-comment-history');
            historyEl.innerHTML = '';
            doc.history.forEach(h => {
                historyEl.innerHTML += `
                    <div class="bg-gray-100 p-2 rounded-xl text-[11px] space-y-0.5">
                        <div class="flex justify-between font-bold text-gray-700">
                            <span>${h.approver} (${h.action})</span>
                            <span class="text-[10px] text-gray-400">${h.time}</span>
                        </div>
                        <p class="text-gray-600">${h.opinion}</p>
                    </div>
                `;
            });

            document.getElementById('modal-new-reply').value = '';

            const actionBtns = document.getElementById('modal-action-buttons');
            actionBtns.innerHTML = '';

            if (doc.step === 'waiting' || doc.step === 'progress') {
                const currentName = doc.step === 'waiting' ? '가오나시 본부장' : approvers[doc.currentApproverIndex];
                actionBtns.innerHTML = `
                    <button onclick="processApproval(${doc.id}, 'reject')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl text-xs shadow">반려</button>
                    <button onclick="processApproval(${doc.id}, 'approve')" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 rounded-xl text-xs shadow">승인 (${currentName})</button>
                `;
            } else {
                actionBtns.innerHTML = `<div class="w-full text-center text-xs text-gray-400 py-1">종결된 문서입니다.</div>`;
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentOpenDocId = null;
        }

        function processApproval(id, actionType) {
            const doc = documents.find(d => d.id === id);
            if (!doc) return;

            const replyText = document.getElementById('modal-new-reply').value.trim();
            const currentActor = doc.step === 'waiting' ? '가오나시 본부장' : approvers[doc.currentApproverIndex];
            const nowStr = new Date().toLocaleString();

            if (actionType === 'reject') {
                doc.step = 'rejected';
                doc.history.push({
                    approver: currentActor,
                    action: '반려',
                    opinion: replyText || '반려 처리되었습니다.',
                    time: nowStr
                });
            } else {
                if (doc.step === 'waiting') {
                    doc.step = 'progress';
                    doc.currentApproverIndex = 1;
                    doc.history.push({
                        approver: '가오나시 본부장',
                        action: '1차 승인 완료',
                        opinion: replyText || '승인합니다.',
                        time: nowStr
                    });
                } else if (doc.step === 'progress') {
                    if (doc.currentApproverIndex === 1) {
                        doc.step = 'approved';
                        doc.history.push({
                            approver: '토토로 유경',
                            action: '최종 승인 완료',
                            opinion: replyText || '최종 승인합니다.',
